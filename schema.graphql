type Query {
    jobPost(id: ID!): JobPostResponse
    jobPosts(filter: JobPostSearchFilter, limit: Int, offset: Int): JobPostsResponse
}

type Mutation {
    createCompany(name: String): CreateCompanyResponse
    signup(email: String!, password: String!): AuthResponse
    login(email: String!, password: String!): AuthResponse
    setUserCompany(userId: ID!, companyId: ID!): UserResponse
    createJobPost(input: CreateJobPostInput!): JobPostResponse
    updateJobPost(input: UpdateJobPostInput!): JobPostResponse
    deleteJobPost(id: ID!): DeleteJobPostResponse
}

type Company {
    name: String
}

type JobPost {
    id: ID!
    companyId: ID!
    title: String!
    location: String!
    description: String!
    contractType: String!
    minSalaryMoney: String
    maxSalaryMoney: String
    benefitsCsv: String
    extrasCsv: String
}

type CreateCompanyResponse {
    code: String!
    success: Boolean!
    message: String!
    company: Company
}

type JobPostResponse {
    code: String!
    success: Boolean!
    message: String!
    jobPost: JobPost
}

type JobPostsResponse {
    code: String!
    success: Boolean!
    message: String!
    items: [JobPost!]
}

input JobPostSearchFilter {
    title: String
    location: String
    minSalaryAmount: Float
    maxSalaryAmount: Float
}

type DeleteJobPostResponse {
    code: String!
    success: Boolean!
    message: String!
    id: ID
    deleted: Boolean
}

input CreateJobPostInput {
    companyId: ID!
    title: String!
    location: String!
    description: String!
    contractType: String!
    minSalaryAmount: Float
    minSalaryCurrency: String
    maxSalaryAmount: Float
    maxSalaryCurrency: String
    benefitsCsv: String
    extrasCsv: String
}

input UpdateJobPostInput {
    id: ID!
    companyId: ID!
    title: String!
    location: String!
    description: String!
    contractType: String!
    minSalaryAmount: Float
    minSalaryCurrency: String
    maxSalaryAmount: Float
    maxSalaryCurrency: String
    benefitsCsv: String
    extrasCsv: String
}

type User {
    id: ID!
    email: String!
    companyId: ID
}

type AuthResponse {
    code: String!
    success: Boolean!
    message: String!
    token: String
    user: User
}

type UserResponse {
    code: String!
    success: Boolean!
    message: String!
    user: User
}
