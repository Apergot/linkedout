type Query {
    books: [Book]
}

type Book {
    title: String
    author: String
}

type AddBookMutationResponse {
    code: String!
    success: Boolean!
    message: String!
    book: Book
}

type DeleteBookMutationResponse {
    code: String!
    success: Boolean!
    message: String!
}

type Mutation {
    addBook(title: String, author: String): AddBookMutationResponse
    deleteBook(title: String, author: String): DeleteBookMutationResponse
}
