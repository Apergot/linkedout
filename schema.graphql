type Query {
    books: [Book]
}

type Company {
    name: String
}

type Book {
    title: String
    author: String
}

type AddBookMutationResponse {
    code: String!
    success: Boolean!
    message: String!
    book: Book
}

type CreateCompanyResponse {
    code: String!
    success: Boolean!
    message: String!
    company: Company
}

type Mutation {
    addBook(title: String, author: String): AddBookMutationResponse
    createCompany(name: String): CreateCompanyResponse
}
